{% extends 'base.html' %}
{% load static %}
{% block title %}Confirm delete{% endblock %}
{% block robots %}
<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/forms.css' %}"><link rel="stylesheet" href="{% static 'css/pages/form_page.css' %}">{% endblock %}
{% block content %}
<h2>Delete {{ object }}?</h2>
<form class="form-card" method="post">{% csrf_token %}<button class="btn-danger" type="submit">Yes, delete</button></form>
{% endblock %}

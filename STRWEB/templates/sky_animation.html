{% load static %}
<section class="sky" aria-label="Confectionery Shop">
	<ul class="sky-sweets" aria-hidden="true">
		<li class="sky-sweet" style="--x: 32%; --d: 0s; --spin: 540deg">
			<img src="{% static 'img/sweets/cupcake.png' %}" alt="" width="128" height="128">
		</li>
		<li class="sky-sweet" style="--x: 44%; --d: .5s; --spin: -720deg">
			<img src="{% static 'img/sweets/candy.png' %}" alt="" width="128" height="128">
		</li>
		<li class="sky-sweet" style="--x: 52%; --d: 1s; --spin: 630deg">
			<img src="{% static 'img/sweets/donut.png' %}" alt="" width="128" height="128">
		</li>
		<li class="sky-sweet" style="--x: 60%; --d: 1.5s; --spin: -540deg">
			<img src="{% static 'img/sweets/lollipop.png' %}" alt="" width="128" height="128">
		</li>
		<li class="sky-sweet" style="--x: 70%; --d: 2s; --spin: 720deg">
			<img src="{% static 'img/sweets/macaron.png' %}" alt="" width="128" height="128">
		</li>
	</ul>

	<div class="cloud" aria-hidden="true">
		<span class="cloud-eye"></span>
		<span class="cloud-eye"></span>
		<span class="cloud-mouth"></span>
	</div>

	<p class="sky-title">Confectionery Shop</p>
</section>

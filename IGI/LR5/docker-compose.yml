services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py create_admin &&
             gunicorn confectionery_shop.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"